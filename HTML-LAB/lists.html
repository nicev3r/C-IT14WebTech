<!DOCTYPE html>
<html>
<head>
  <title>HTML Lists</title>
</head>
<body>

  <h2>B. Ordered List</h2>
  <h3>Top 5 Programming Languages</h3>
  <ol>
    <li>JavaScript</li>
    <li>Python</li>
    <li>Java</li>
    <li>PHP</li>
    <li>C#</li>
  </ol>

  <h2>C. Nested List</h2>
  <ul>
    <li>Computer Science
      <ul>
        <li>Programming
          <ul>
            <li>Java</li>
            <li>Python</li>
            <li>PHP</li>
          </ul>
        </li>
        <li>Web Development
          <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
          </ul>
        </li>
      </ul>
    </li>
  </ul>

</body>
</html>
