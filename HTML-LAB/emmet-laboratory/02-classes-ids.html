<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>02-CLASSES </title>
</head>
<body>
    
<!--PRACTICE-->
<!-- 1. Class (Emmet: p.introduction) -->
<p class="introduction">This is a paragraph with a class.</p>

<!-- 2. ID (Emmet: div#container) -->
<div id="container">This is a div with an ID.</div>

<!-- 3. Multiple Classes (Emmet: div.card.featured) -->
<div class="card featured"> This div has two classes.</div>

<!-- TASK -->

<!-- header with class site-header (Emmet: header.site-header) -->
<header class="site-header">
        <h1>My Website</h1>
    </header>

<!-- nav with ID main-nav (Emmet: nav#main-nav) -->
<nav id="main-nav">
    Home | About | Contact
 </nav>

 <!-- main with class content (Emmet: main.content) -->
    <main class="content">

        <!-- 4. ID + Class (Emmet: section#about.content-section) -->
        <!-- This section is also the "section with ID about" from the task -->
        <section id="about" class="content-section">
            <h2>About Me</h2>
            <p>This is the about section.</p>
        </section>

    </main>

    <!-- footer with class site-footer (Emmet: footer.site-footer) -->
    <footer class="site-footer">
        Footer: Made using Emmet
    </footer>


</body>
</html>
