    <H1>PART 6: NUMBERING WITH 1</H1>
    <!--EMMET: ul>li.item$*5-->
    <!-- The $ becomes 1,2,3,4,5 inside the class name-->

    <ul>
        <li class="item1"></li>
        <li class="item2"></li>
        <li class="item3"></li>
        <li class="item4"></li>
        <li class="item5"></li>
    </ul>

    <!--Now i practice these: ul>li{Menu $}*5-->

        <li>Menu 1</li>
        <li>Menu 2</li>

        <li>Menu 4</li>
        <li>Menu 5</li>
    </ul>
