<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Emmet Shortcuts</title>
</head>
<body>

    <!-- header (Emmet: header) -->
    <header>
        <!-- h1 (Emmet: h1) -->
        <h1>My Emmet Page</h1>

        <!-- nav (Emmet: nav) -->
        <nav>
            Home | About | Contact
        </nav>
    </header>

    <!-- main (Emmet: main) -->
    <main>

        <!-- h2 x2 (Emmet: h2*2) -->
        <h2>First Heading 2</h2>
        <h2>Second Heading 2</h2>

        <!-- p x3 (Emmet: p*3) -->
        <p>This is the first paragraph.</p>
        <p>This is the second paragraph.</p>
        <p>This is the third paragraph.</p>

        <!-- div (Emmet: div) -->
        <div>
            This is a div container.
        </div>

    </main>

    <!-- footer (Emmet: footer) -->
    <footer>
        <p>Footer: Made using Emmet</p>
    </footer>

</body>
</html>
