<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Attributes</title>
</head>
<body>
    
    <H1>Part 8: HTML Attributes</H1>

    <!-- Emmet: input[type="text"] -->
     <input type="text">
     <br><br> 

    <!-- Then. Emmet: input[type="text" placeholder="Enter your name"] -->
     <input type="text" placeholder="Enter your name">

     <!-- Try. Emmet: input[type="email" placeholder="Enter your email"] -->
    <input type="email" placeholder="Enter your email">

    <!-- Image. Emmet: img[src="images/profile.jpg" alt="Profile Photo"] -->
    <img src="images/profile.jpg" alt="Profile Photo">

    <!-- Link. Emmet: a[href="https://www.google.com"]{Google} -->
     <a href="https://www.google.com">Google</a>

</body>
</html>
